site_name: regimekit
site_description: JAX-based Hidden Semi-Markov Model framework for market-regime detection and forecasting.
repo_name: regimekit
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Guide:
      - Install: guide/install.md
      - Quickstart: guide/quickstart.md
      - Data contracts: guide/contracts.md
      - Configuration reference: guide/config.md
      - Data providers & ToS: guide/providers.md
      - Forecasting: guide/forecasting.md
      - Model bundle: guide/bundle.md
      - Output files: guide/outputs.md
      - Backtesting: guide/backtesting.md
      - Validation: guide/validation.md
      - Python API and CLI: guide/project.md
      - Examples and tutorial: guide/examples.md
      - Extending: guide/extending.md
      - Troubleshooting: guide/troubleshooting.md
  - Math:
      - Time conventions: math/time.md
      - Parameters: math/parameters.md
      - Emissions: math/emissions.md
      - Durations: math/durations.md
      - Transitions: math/transitions.md
      - Higher-order memory: math/higher_order.md
      - State space: math/statespace.md
      - Engines: math/engines.md
      - Explicit-duration engine: math/engine_explicit.md
      - Estimation: math/estimation.md
      - Model selection: math/model_selection.md
      - Forecasting: math/forecasting.md
      - Evaluation: math/evaluation.md
  - API reference:
      - Overview: api/index.md
      - Project and CLI: api/project.md
      - Configuration: api/config.md
      - Data: api/data.md
      - Model: api/model.md
      - Engines and estimation: api/engines.md
      - Inference: api/inference.md
      - Evaluation: api/evaluation.md
      - Persistence and utilities: api/persistence.md
  - Releases:
      - 0.2.0: releases/0.2.0.md
      - 0.1.0: releases/0.1.0.md
  - Architecture decisions:
      - Index: adr/index.md
      - "0001 Continuous-time parameters, discrete-time inference": adr/0001-continuous-time-parameters-discrete-inference.md
      - "0002 Apache-2.0 license, no provider data redistribution": adr/0002-license-and-data-redistribution.md
      - "0003 JAX + Equinox + Optax stack": adr/0003-jax-equinox-optax-stack.md
      - "0004 One generic engine over a structured state index": adr/0004-generic-engine-structured-state-index.md
      - "0005 MAP via L-BFGS as the primary estimator": adr/0005-map-lbfgs-primary-estimator.md
      - "0006 Shifted negative-binomial phase expansion": adr/0006-shifted-negbin-phase-expansion.md
      - "0007 Explicit-duration engine requires a regular grid": adr/0007-explicit-duration-regular-grid.md
      - "0008 Approximate-inference plug-in interface": adr/0008-approx-inference-plugin.md
      - "0009 pydantic v2 + YAML configuration": adr/0009-pydantic-v2-yaml-config.md
      - "0010 typer CLI, pandas, pyarrow": adr/0010-typer-cli-pandas-pyarrow.md
      - "0011 safetensors model bundle": adr/0011-safetensors.md
      - "0012 Core/profile split": adr/0012-core-profile-split.md
      - "0013 Three clocks including steps": adr/0013-three-clocks.md
      - "0014 Two-repository split": adr/0014-two-repo-split.md
      - "0022 Recurrent emissions and the annualization exception": adr/0022-in-scan-emissions.md
