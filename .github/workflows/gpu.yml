name: GPU

# Manual trigger only. Requires a self-hosted runner labelled `gpu`; repositories without one simply
# have nowhere for this job to run, which is the intended "skipped otherwise" behaviour.
on:
  workflow_dispatch: {}

jobs:
  gpu-tests:
    runs-on: [self-hosted, gpu]
    env:
      HSMMKIT_TYPECHECK: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --extra gpu
      - run: uv run pytest -m gpu
