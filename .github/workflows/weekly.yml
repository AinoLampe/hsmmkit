name: Weekly

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch: {}

jobs:
  recovery-full:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      REGIMEKIT_TYPECHECK: "1"
      JAX_PLATFORMS: cpu
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run nox -s recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-reports
          path: runs/recovery/
