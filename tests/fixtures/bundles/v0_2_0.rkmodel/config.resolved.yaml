schema_version: 1
profile: finance
project:
  name: dax_3state_gbm_nb_steps
  seed: 11
  output_dir: 
    runs
  log_level: INFO
data:
  primary:
    provider: csv
    symbols:
    - SYN
    interval: 1d
    start: '2019-01-01'
    end:
    adjusted: true
    field: close
  clock: steps
  bars_per_day: 1
  cache:
    dir: 
      cache
    snapshot: latest
    max_age_days: 1
  covariates: []
  preparation:
    returns: log
    standardize_covariates: true
    missing_returns: drop
model:
  n_states: 2
  engine: expanded
  d_max: 300
  initial_state: uniform
  emission:
    family: gbm
    params:
      mu:
        mode: free
        values:
        init:
        - 0.0005
        - -0.001
        init_mean_sojourn_days:
        init_mean_sojourn_steps:
        bounds:
        constraint: none
        prior:
        tie:
      sigma:
        mode: free
        values:
        init:
        - 0.008
        - 0.018
        init_mean_sojourn_days:
        init_mean_sojourn_steps:
        bounds:
        constraint: increasing
        prior:
          type: lognormal
          sd: 1.0
          alpha:
        tie:
    covariates:
      drift: []
      log_vol: []
    per_series: true
  duration:
    family: geometric
    r:
    params:
      rate:
        mode: free
        values:
        init:
        init_mean_sojourn_days:
        init_mean_sojourn_steps:
        - 30.0
        - 30.0
        bounds:
        constraint: none
        prior:
          type: lognormal
          sd: 1.0
          alpha:
        tie:
    covariates: []
    duration_covariates_at_entry: false
  transition:
    mode: jump
    order: 1
    duration_conditioning: current
    covariates: []
    prior:
    coef_prior_sd: 1.0
  lattice:
estimation:
  optimizer: lbfgs
  max_iter: 40
  tol_f: 1e-09
  tol_g: 1e-06
  restarts: 1
  init:
  - rollvol_kmeans
  - lattice_jitter
  use_priors: true
  std_errors: true
  device: cpu
  chunk_size:
  parallel_scan: false
forecast:
  horizon: 5
  n_sim: 200
  covariate_forecaster:
    type: freeze
    mean_block_length:
    diagonal:
    path:
  quantiles:
  - 0.05
  - 0.25
  - 0.5
  - 0.75
  - 0.95
evaluation:
  metrics:
  - log_score
  - crps
  - pit_coverage
  - rmse
  - bic
  - regime_occupancy
  backtest:
    scheme: expanding
    initial_train_years: 260.0
    rolling_years:
    refit_every_steps: 60
    horizons:
    - 1
    - 5
    embargo_steps: 0
    n_sim:
  strategy:
  labels:
output:
  write:
  - backtest
warnings: []
